<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<script>
  async function resetCalculator() {
    const numberOne = document.querySelector('.numberOne');
    const numberTwo = document.querySelector('.numberTwo');
    const historyList = document.getElementById('historyList');
    const historyStatus = document.getElementById('historyStatus');
    if (historyList.children.length === 0) {
      alert('Nothing To Reset');
      return;
    }

    if (!confirm('Are you sure you want to reset the calculator?')) {
      return;
    }

    try {
      await pendingHistorySave;
      const response = await fetch('/api/history', { method: 'DELETE' });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || 'Unable to clear history.');
      }

      numberOne.value = '';
      numberTwo.value = '';
      selectedOperation = null;
      document.querySelectorAll('.operation button').forEach(button => {
        button.classList.remove('selected');
      });
      document.getElementById('result').classList.remove('error');
      document.getElementById('result').textContent = '0';
      historyList.replaceChildren();
      document.getElementById('numberError').classList.remove('error');
      document.getElementById('numberError').textContent = '';
      historyStatus.textContent = '';
      historyStatus.classList.remove('error');
    } catch (error) {
      historyStatus.textContent = `Could not clear history: ${error.message}`;
      historyStatus.classList.add('error');
    }
  }
</script>
<body>

  <div class="page">

    <div class="calculator" style="width: 400px; padding: 24px; border-radius: 16px;">
      <h1>Calculator</h1>
      <div class="input">
        <input type="text" class="numberOne" placeholder="Number 1"> 
        <input type="text" class="numberTwo" placeholder="Number 2"> 
      </div>
      <div class="errorInput"><p><span id="numberError"></span></span></p></div>
      <div class="operation">
        <button class="add">+
        </button>
        <button class="subtract">-
        </button>
        <button class="multiply">x
        </button>
        <button class="divide">/
        </button>
      </div>
      <div class="buttonGroup" style="display: flex; justify-content: center; gap: 16px; margin-top: 16px;">
        <button type="button" class="reset" onclick="resetCalculator()">Reset</button>
        <button type="button" class="submit">Submit</button>
      </div>
      <div class="result">
        <p>Result: <span id="result">0</span></p>
      </div>
      <div class="history">
        <h2>History</h2>
        <ul id="historyList" style="padding: 0; margin: 0;">
        </ul>
        <p id="historyStatus" aria-live="polite"></p>
      </div>
    </div>
  </div>


</body>
</html>
