services:
  - type: web
    name: calculator-homework
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /
    disk:
      name: history-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HISTORY_FILE
        value: /var/data/history.txt
